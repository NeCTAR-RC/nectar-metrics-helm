apiVersion: v2
name: nectar-metrics-helm
description: >-
  Nectar status-page metrics stack: an HA pair of VictoriaMetrics
  single-node instances (vmagent + vmauth, managed by the
  VictoriaMetrics operator) plus the nectar-metrics collector cron
  jobs that feed it.
type: application
version: 0.2.0
# appVersion tracks the nectar-metrics collector image tag.
appVersion: "2.0.0"
sources:
- https://github.com/NeCTAR-RC/nectar-metrics-helm.git
- https://github.com/NeCTAR-RC/nectar-metrics.git
