{{- if .Values.backup.enabled }}
# Nightly logical backup: streams a full /api/v1/export from the
# first vmsingle instance to an S3-compatible bucket. Restore via
# /api/v1/import. The second replica is the fast-recovery copy; this
# is the disaster-recovery copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nectar-metrics.fullname" . }}-backup
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "nectar-metrics.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- with .Values.backup.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              {{- with .Values.backup.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              args:
                - copyurl
                - "{{ include "nectar-metrics.vmsingleUrl" (dict "ctx" . "suffix" (first .Values.vmsingle.instances)) }}/api/v1/export?match[]={__name__=~'.%2B'}"
                - "{{ .Values.backup.remote }}/nectar-metrics-export-latest.jsonl"
              {{- with .Values.backup.existingSecret }}
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
{{- end }}
