{{- range .Values.collectors.jobs }}
{{- if .enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nectar-metrics.fullname" $ }}-{{ .name }}
  labels:
    {{- include "nectar-metrics.labels" $ | nindent 4 }}
    app.kubernetes.io/component: collector-{{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      template:
        metadata:
          {{- if $.Values.vault.enabled }}
          annotations:
            vault.hashicorp.com/role: "{{ $.Values.vault.role }}"
            vault.hashicorp.com/agent-inject: "true"
            # Init-container only: a sidecar would stop the Job from
            # ever completing.
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/secret-volume-path-secrets.conf: /etc/nectar-metrics/nectar-metrics.conf.d
            vault.hashicorp.com/agent-inject-secret-secrets.conf: "{{ $.Values.vault.settings_secret }}"
            vault.hashicorp.com/agent-inject-template-secrets.conf: |
              {{ print "{{- with secret \"" $.Values.vault.settings_secret "\" -}}" }}
              {{ print "[service_auth]" }}
              {{ print "password = {{ .Data.data.keystone_password }}" }}
              {{ print "{{- if .Data.data.sentry_dsn }}" }}
              {{ print "[sentry]" }}
              {{ print "dsn = {{ .Data.data.sentry_dsn }}" }}
              {{ print "{{- end }}" }}
              {{ print "{{- end -}}" }}
          {{- end }}
          labels:
            {{- include "nectar-metrics.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: collector-{{ .name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "nectar-metrics.serviceAccountName" $ }}
          {{- with $.Values.collectors.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .name }}
              image: "{{ $.Values.collectors.image.repository }}:{{ $.Values.collectors.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.collectors.image.pullPolicy }}
              {{- with $.Values.collectors.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              # No --config-file/--config-dir: /etc/nectar/metrics.ini
              # and /etc/nectar-metrics/nectar-metrics.conf.d are on
              # the app's default search paths.
              args:
                - {{ .entrypoint }}
                - --protocol
                - {{ .protocol }}
              {{- with .resources | default $.Values.collectors.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /etc/nectar
                  readOnly: true
                {{- if not $.Values.vault.enabled }}
                # With Vault enabled the agent injects secrets.conf at
                # this path instead.
                - name: secrets
                  mountPath: /etc/nectar-metrics/nectar-metrics.conf.d
                  readOnly: true
                {{- end }}
                {{- if $.Values.collectors.persistence.enabled }}
                - name: working-dir
                  mountPath: /var/lib/nectar-metrics
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ include "nectar-metrics.fullname" $ }}-config
            {{- if not $.Values.vault.enabled }}
            - name: secrets
              secret:
                secretName: {{ include "nectar-metrics.fullname" $ }}-secrets
            {{- end }}
            {{- if $.Values.collectors.persistence.enabled }}
            - name: working-dir
              persistentVolumeClaim:
                claimName: {{ include "nectar-metrics.fullname" $ }}-working-dir
            {{- end }}
{{- end }}
{{- end }}
