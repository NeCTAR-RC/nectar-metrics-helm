{{- if not .Values.vault.enabled }}
# Dev/test fallback when Vault agent injection is not available.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nectar-metrics.fullname" . }}-config
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  metrics.ini: |
    [metrics]
    working_dir = /var/lib/nectar-metrics
    log_dir = /tmp

    [openstack]
    user = {{ .Values.conf.openstack.user }}
    passwd = {{ .Values.conf.openstack.passwd }}
    name = {{ .Values.conf.openstack.name }}
    url = {{ .Values.conf.openstack.url }}
    zone = {{ .Values.conf.openstack.zone }}

    [gnocchi]
    archive_policy = {{ .Values.conf.gnocchi.archive_policy }}

    [victoria]
    url = {{ include "nectar-metrics.writeUrl" . }}
{{- end }}
