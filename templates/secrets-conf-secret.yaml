{{- if not .Values.vault.enabled }}
# Dev/test fallback when Vault agent injection is not available:
# mounted into the nectar-metrics.conf.d config dir in place of the
# Vault-rendered secrets.conf.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nectar-metrics.fullname" . }}-secrets
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.conf: |
    [service_auth]
    password = {{ .Values.conf.service_auth.password }}
    {{- if .Values.conf.sentry.dsn }}

    [sentry]
    dsn = {{ .Values.conf.sentry.dsn }}
    {{- end }}
{{- end }}
