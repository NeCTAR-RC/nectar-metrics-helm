{{- if .Values.serviceAccount.create -}}
# The vault kubernetes-auth policies are templated on the service
# account name (secret/data/k8s/<namespace>/<service account>/...),
# so the collectors must run as a service account matching the
# secret path, not as 'default'.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nectar-metrics.serviceAccountName" . }}
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
