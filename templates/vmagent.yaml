{{- if .Values.components.vmstack }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: {{ include "nectar-metrics.fullname" . }}
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
spec:
  image:
    tag: {{ .Values.victoriametrics.version }}
  # Operator-applied security context compatible with the
  # 'restricted' Pod Security Standard (non-root, no capabilities,
  # RuntimeDefault seccomp). Set explicitly; the operator-wide
  # default has changed between operator releases.
  useStrictSecurity: true
  replicaCount: {{ .Values.vmagent.replicaCount }}
  {{- if gt (int .Values.vmagent.replicaCount) 1 }}
  # Stop a node drain evicting both replicas at once.
  podDisruptionBudget:
    maxUnavailable: 1
  {{- end }}
  # Push-only: the collectors send to this vmagent's ingestion
  # endpoints; no scrape targets are selected (which also means
  # replicas never duplicate data).
  selectAllByDefault: false
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmagent
  # Persistent queue so a vmsingle outage is buffered and replayed
  # (this is what makes the replicated pair genuinely HA on the
  # write path).
  statefulMode: true
  statefulStorage:
    volumeClaimTemplate:
      spec:
        {{- with .Values.vmagent.queue.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.vmagent.queue.size }}
  remoteWrite:
    {{- range .Values.vmsingle.instances }}
    - url: {{ include "nectar-metrics.vmsingleUrl" (dict "ctx" $ "suffix" .) }}/api/v1/write
    {{- end }}
  {{- with .Values.vmagent.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
