{{- if .Values.components.vmstack }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ include "nectar-metrics.fullname" . }}
  labels:
    {{- include "nectar-metrics.labels" . | nindent 4 }}
spec:
  image:
    tag: {{ .Values.victoriametrics.version }}
  # Operator-applied security context compatible with the
  # 'restricted' Pod Security Standard (non-root, no capabilities,
  # RuntimeDefault seccomp). Set explicitly; the operator-wide
  # default has changed between operator releases.
  useStrictSecurity: true
  replicaCount: {{ .Values.vmauth.replicaCount }}
  {{- if gt (int .Values.vmauth.replicaCount) 1 }}
  # Stop a node drain evicting both replicas at once.
  podDisruptionBudget:
    maxUnavailable: 1
  {{- end }}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmauth
  # Read-path failover: pin to the first healthy vmsingle rather than
  # round-robin, so consumers see a consistent view while a replica
  # is down or healing.
  unauthorizedUserAccessSpec:
    url_prefix:
      {{- range .Values.vmsingle.instances }}
      - {{ include "nectar-metrics.vmsingleUrl" (dict "ctx" $ "suffix" .) }}
      {{- end }}
    load_balancing_policy: first_available
    retry_status_codes:
      - 500
      - 502
      - 503
  {{- with .Values.vmauth.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
